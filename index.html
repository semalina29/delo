<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Двадцатка · Картотека</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0e0c20;--card:#181538;--elev:#221e4a;--bdr:#302b5e;--tx:#e8e6ff;--txd:#9994c4;--txm:#6b6690;--ac:#a78bfa;--ac2:#8b5cf6;--gn:#34d399;--yl:#fbbf24;--rd:#f87171;--bl:#60a5fa}
body{background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;display:flex;height:100vh;overflow:hidden}
.sb{width:300px;background:var(--card);border-right:1px solid var(--bdr);display:flex;flex-direction:column;height:100vh;flex-shrink:0}
.sb-h{padding:20px 16px 14px;border-bottom:1px solid var(--bdr)}
.sb-h h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
.sb-h .sub{font-size:12px;color:var(--txd);margin-top:2px}
.sb-list{flex:1;overflow-y:auto;padding:6px 0}
.pi{padding:12px 16px;cursor:pointer;border-left:3px solid transparent;transition:background .12s;display:flex;align-items:center;gap:10px}
.pi:hover{background:var(--elev)}
.pi.act{background:var(--elev);border-left-color:var(--ac)}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:13px;flex-shrink:0}
.pi-info{flex:1;min-width:0}
.pi-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-meta{font-size:11px;color:var(--txd);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-ft{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;gap:6px}
.sb-ft button{flex:1;padding:6px;background:var(--elev);border:1px solid var(--bdr);color:var(--tx);border-radius:5px;font-size:11px;cursor:pointer}
.sb-ft button:hover{background:var(--ac);border-color:var(--ac)}
.ct{flex:1;padding:28px 36px;overflow-y:auto}
.ph{display:flex;align-items:flex-start;gap:18px;padding-bottom:20px;border-bottom:1px solid var(--bdr);margin-bottom:20px}
.av-l{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:24px;flex-shrink:0}
.pt h2{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:2px}
.pt .meta{color:var(--txd);font-size:13px}
.pt .sph{color:var(--ac);font-size:13px;margin-top:4px;font-weight:500}
.tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--bdr);flex-wrap:wrap}
.tab{padding:10px 16px;background:0;border:0;color:var(--txd);cursor:pointer;font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab:hover{color:var(--tx)}
.tab.act{color:var(--ac);border-bottom-color:var(--ac)}
.tc{display:none}.tc.act{display:block}
.cd{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:18px;margin-bottom:14px}
.cd h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--ac)}
.cd p,.cd .v{color:var(--tx);white-space:pre-wrap;line-height:1.6;margin-bottom:8px}
.cd .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--txm);font-weight:600;margin-bottom:4px}
.cd .q{border-left:3px solid var(--ac);padding-left:12px;margin:10px 0;font-style:italic;white-space:pre-wrap}
.cd .zr{margin-top:12px;padding:10px 12px;background:rgba(167,139,250,.06);border-radius:5px;border-left:3px solid var(--ac2)}
.cd .zr .lbl{color:var(--ac);margin-bottom:4px}
.gl li{padding:6px 0 6px 20px;position:relative;list-style:none}
.gl li::before{content:'→';position:absolute;left:0;color:var(--ac);font-weight:700}
.ae{background:var(--card);border:1px dashed var(--bdr);border-radius:8px;padding:18px;margin-bottom:20px}
.ae h4{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--txd)}
.ae .hn{color:var(--txd);font-size:12px;margin-bottom:10px}
.fr{display:flex;gap:10px;margin-bottom:10px}
.fb{margin-bottom:14px}
.fb .fl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--txm);font-weight:600;margin-bottom:4px;display:block}
input,textarea,select{background:var(--elev);border:1px solid var(--bdr);color:var(--tx);padding:8px 10px;border-radius:5px;font-family:inherit;font-size:13px;width:100%}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac)}
textarea{min-height:80px;resize:vertical;line-height:1.5}
.btn{background:var(--ac);color:#1a1332;border:0;padding:8px 16px;border-radius:5px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{background:var(--ac2);color:#fff}
.btn-d{background:0;color:var(--rd);border:1px solid var(--rd);padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer}
.btn-d:hover{background:var(--rd);color:#fff}
.sv{color:var(--gn);font-size:12px;opacity:0;transition:opacity .3s;margin-left:10px}
.rz{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:20px;margin-bottom:14px}
.rz-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.rz-n{font-size:18px;font-weight:700;color:var(--ac);margin-bottom:2px}
.rz-d{font-size:12px;color:var(--txd)}
.rz-s{margin-bottom:14px}
.rz-s:last-child{margin-bottom:0}
.rz-sl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--txm);font-weight:600;margin-bottom:6px}
.rz-sb{color:var(--tx);white-space:pre-wrap;line-height:1.6}
.rz-v{background:rgba(52,211,153,.05);border-left:3px solid var(--gn);padding:10px 12px;border-radius:5px}
.rz-v .rz-sl{color:var(--gn)}
.tl{position:relative;padding-left:36px;margin-top:16px}
.tl::before{content:'';position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--bdr)}
.ti{position:relative;margin-bottom:20px}
.ti::before{content:'';position:absolute;left:-28px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--ac)}
.ti.t-win::before{background:var(--gn);box-shadow:0 0 0 2px var(--gn)}
.ti.t-setback::before{background:var(--rd);box-shadow:0 0 0 2px var(--rd)}
.ti.t-task::before{background:var(--bl);box-shadow:0 0 0 2px var(--bl)}
.ti.t-note::before{background:var(--yl);box-shadow:0 0 0 2px var(--yl)}
.tl-d{font-size:11px;color:var(--txd);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;font-weight:600}
.tl-t{font-weight:600;font-size:14px;margin-bottom:4px}
.tl-b{color:var(--txd);font-size:13px;white-space:pre-wrap}
.empty{text-align:center;padding:50px 20px;color:var(--txm)}
.empty h3{color:var(--txd);font-size:15px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:6px;padding:12px 14px}
.stat-l{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--txm);font-weight:600}
.stat-v{font-size:22px;font-weight:700;margin-top:3px}
.nb{display:inline-block;padding:3px 8px;background:rgba(107,102,144,.15);color:var(--txm);border-radius:3px;font-size:11px;font-weight:500;margin-left:6px}
.str-grid{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;margin-bottom:10px}
.str-key{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--txm);font-weight:600;padding-top:2px}
.str-val{color:var(--tx);white-space:pre-wrap;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--ac)}
</style>
</head>
<body>
<aside class="sb">
<div class="sb-h"><h1>Двадцатка</h1><div class="sub">Картотека · Круг Жданова</div></div>
<div class="sb-list" id="sl"></div>
<div class="sb-ft">
<button onclick="exportAll()">Экспорт</button>
<button onclick="document.getElementById('imp').click()">Импорт</button>
<input type="file" id="imp" accept=".json" style="display:none" onchange="importAll(event)">
</div>
</aside>
<main class="ct" id="ct"></main>
<script>
const P=[
{id:'pavel-semenov',name:'Павел Семёнов',age:30,city:'Самара',sph:'Сеть вейп-шопов · дилер автомасел',ini:'ПС',clr:'#a78bfa',
info:`ИП, в управлении 2 бизнеса: сеть из 4 вейп-шопов и официальный дилер российского производителя автомобильных масел и смазок. В табачном бизнесе с 2019 года.

Предыстория: ноябрь 2018 — пришёл на завод с дипломом, понял что не хочет быть ни минуты. Январь 2019 — купил кальянную за 350 тыс, вышел на 100-145 тыс/мес чистыми через 7 месяцев. Схему «покупаем уставшую кальянную → в конфетку → доход» повторил второй раз. Ковид убил оба заведения. Зацепился за кальянный магазин → вейп-шопы.

В 2023 году был в плохом состоянии: пьянки, 0 спорта, ужасное питание. С того момента скинул ~28 кг, начал зал, следить за питанием. Кардинально поменялся.`,
zoom:{att:true,q:`Последние лет пять ощущение, что кругом готовые рабочие бизнес-идеи валяются под ногами, деньги лежат, но я их не вижу. Всё время что-то стопорит. Идея пришла, вроде рабочая, но всё время себя отговариваешь.`,zr:''},
goals:['Научиться видеть и оценивать бизнес-идеи','Запустить 2 новых бизнес-проекта к 01.07.2027','Выйти на стабильный личный доход 1.5 млн','Знать идеально все про свой доход/расход'],
strategy:{
pointA:`Дело: ИП, 4 вейп-шопа + дилерство масел (держит просто так). Роль: стратегия, выбор продукта/контрагентов, операционка, контроль сервиса. За год адаптировались под изменения законодательства, сменили 90% чёрного на белое. Оборот первой половины 2026 чуть больше 2025. Не нашли стабильный состав сотрудников. Патент убрали — +200 тыс/мес расходов.

Финансы: Доход ~200-250 тыс. Расход ~120-140 тыс. Живёт в режиме «лучше 100 тыс в товаре прокручу». Квартира + авто. Кредитов нет. Подушка: 2-3 мес, эконом 6 мес.

Тело: 183/100, жир 29.3%. Анализы не сдавал. Сон 7 ч. Зал 3 раза/нед + пресс 4-5 раз. Бильярд — главный компенсатор.

Отношения: Не женат по штампу, по факту жена + сын 6 лет. С женой качели «всё хорошо — разводимся». С сыном классно. С родителями максимально прекрасные.

Окружение: 3 нейтральных, 1 тянет вверх, непонимание с женщиной тянет вниз.

Состояние: Энергия 8.5/10, тонус — кайф. Срывов/депрессий нет. Алкоголь редко, больше гастрономический интерес.`,
goal:`Дело: 1) Научиться оценивать и планировать бизнес-идеи к 01.12.2026. 2) Запустить 2 бизнес-проекта к 01.07.2027.
Финансы: 3) Идеально знать доход/расход к 01.11.2026. 4) Стабильный доход 1.5 млн к 01.07.2027.
Тело: 5) Решить вопросы по здоровью к 01.12.2026. 6) Вес 95 кг, жировая -5% к 01.12.2026.
Отношения: 7) Определиться с женой (с ней или один, но дом = источник восстановления) к 01.09.2026.
Окружение: 8) Расширить круг: люди выше меня к 01.10.2026. 9) Безвозмездные добрые дела (детдом) к 01.03.2027.
Состояние: 10) Уверенность, какую и представить трудно, к 15.01.2027.`,
plan:`Декомпозиция: 50 бизнес-идей с реальными цифрами к 01.12.2026 → 2 сферы к 01.12.2026 → 2 бизнес-плана к 01.02.2027 → запуск первого к 01.04.2027 → запуск второго к 01.07.2027.
По вейпам: оптимизация бизнеса, фиксированные даты вывода себе, устойчивые 300 к 01.12.2026 → новый белый вейп-шоп к 01.12.2026 → 450 тыс → найм управляющего (ЗП 100), себе 500 к 01.03.2027 → второй белый вейп-шоп к 01.02.2027 → 700 тыс к 01.05.2027.

Ограничения: непонятки с женой, нечёткий сон, слабое планирование, бездействие от страха, думает много — делает мало, нет чёткой стратегии в бизнесе, зависимость от телефона.

Сдвиги: 1) Начать делать. 2) Ввести планирование недели.`}},

{id:'nikita-vilensky',name:'Никита Виленский',age:null,city:'Москва',sph:'Адвокат · арбитраж · к.ю.н.',ini:'НВ',clr:'#60a5fa',
info:`Кандидат юридических наук, адвокат. Специализация: арбитражный процесс (корпоративные конфликты, строительные споры, банкротство юр. лиц). Пишет книгу. Частнопрактикующий (фрилансер). ТГ-канал contractorslegalshield. Родом из Самары, живёт и работает в Москве.`,
zoom:{att:true,q:`Неплохой специалист, но не могу сделать следующий шаг. Нет команды, нет полноценного бизнеса, нет системы продаж — нас, юристов, не учат продавать.`,zr:`У меня уже идея пришла по твоей деятельности, как можно двигаться. Попозже озвучу.`},
goals:['Стать специалистом по налоговому праву к 01.08.2027','Придумать онлайн-продукт к 01.08.2027','Устойчивый доход 2 млн к 01.08.2027','Навыки знакомств, убрать залипание','Взрослые отношения с мамой без гиперопеки'],
strategy:{
pointA:`Дело: Частнопрактикующий адвокат, к.ю.н. Годовой доход ~1.2 млн. Нет сотрудников, нет бизнеса. Тащит всю операционку, почти ничего не делегирует. Продукт — выигрывает суды для бизнеса. Сарафан ограничен, ТГ-канал клиентов не приносит.

Финансы: Доход нестабильный, ~120-150 тыс/мес. Накопления 1.6 млн. Дебиторка 1.2 млн (перспективы возврата низкие — неудачная инвестиция по глупости). Расходы: аренда 41 тыс, адвокатские 8.8, маркетолог 20, быт/еда 70. Без дохода проживёт ~год.

Тело: 193/93.2, жир 10.1%. Тестостерон 24.34. Вит D 47. Зал 3-4 р/нед + бассейн. Сон 7-8 ч. С телом ок.

Отношения: Холост. Проблемы в общении с девушками — кажется скучным. Сложно с креативом и игривостью. Амбициозен и в этом. Подолгу залипает на соцсети (превращается в проблему). Папа ушёл из жизни (жалеет о плохих отношениях). С мамой близкие отношения с гиперопекой.

Окружение: Очень одинокий, не душа компании. Переживает из-за нехватки харизмы. Мама (тянет вниз гиперопекой), Владимир (вверх в спорте).

Состояние: Энергия/ясность/тонус — всё по 5. Тянет вниз неудачная личная жизнь.`,
goal:`Дело: налоговое право к 01.08.2027 + онлайн-продукт к 01.08.2027.
Финансы: I кв 300 тыс → II кв 500 → III кв 1 млн → IV кв 2 млн. Найм помощника, система продаж, личный бренд через рилсы.
Тело: набор до 98 кг при 10% жира.
Отношения: навыки знакомств к 01.01.2027, девушка.
Окружение: взрослые отношения с мамой, друзья-мужчины с ресурсами.`,
plan:`Ограничения внутренние: неуверенность, синдром самозванца, страх провалов/потери денег, страх конфликтов, прокрастинация, нет опыта руководства, слабые навыки коммуникации, страх общественного мнения.
Внешние: высокая конкуренция, нет системы продаж, нет маркетинга.

Сдвиги: 1) Умение держать фокус — не листать рилсы. 2) Преодоление жалости к себе и лени (занимается с психологом). 3) Дисциплина — планирование дня, не отвлекаться.`}},

{id:'artem-losev',name:'Артём Лосев',age:28,city:'Самара',sph:'Зубной техник CAD/CAM · зуботехн. лаборатория',ini:'АЛ',clr:'#34d399',
info:`Зубной техник CAD/CAM дизайнер на удалёнке. В профессии с 2018. ИП на УСН 6%. 3 год на удалёнке. Есть помощник на удалёнке. Ранее — дентальная клиника Архипова, ВДЛ. Военный городок до 17 лет, армия ПВО. Развод май 2025 (5 лет вместе). Год закрывал долги, помогал маме и сестре. Депрессия после развода. Сейчас взялся за голову.`,
zoom:{att:true,q:`Пришёл от Кэти Пикчерса. Хочется научиться собирать команду. В потолок ушёл — ценник по рынку высоко, в одного увеличивать работу невозможно, потери сна, стресс.`,zr:`Тебе 28 — зал, питание, движение. Сначала анализы, потом решения.`},
goals:['Вернуть доход 300+ тыс к 11.04.2027','Курсы по профессии каждые полгода','Водительские права','Закрыть кредиты','Накопить подушку 500 тыс - 1 млн','Переехать жить отдельно','Держать тело в тонусе'],
strategy:{
pointA:`Дело: CAD/CAM дизайнер на удалёнке, ИП. Доход: 2024 — 282 тыс/мес, 2025 — 298, 2026 — 213 (просадка). 2 постоянных контрагента. Потерял хорошего заказчика (платил 2X) из-за гулянок после развода.

Финансы: Расходы: маме+сестре 50, на себя 50, бухгалтер 7, кредиты 15. Кредит 300 тыс (обучение). Доля 1/3 в двушке. Сбережений нет — пугает к 28 годам.

Тело: 182/90, жир 25.8%. Тестостерон в норме (15.46 нмоль/л), но инсулин на границе (24.9), HOMA-IR 6.3 (норма <2.7). Засыпает в 2-3 ночи. Спорт пропал при переходе на удалёнку, с 1 авг 2026 вернул зал 2-3 р/нед.

Отношения: В разводе 1 год 2 мес. Год закрывал долги, помогал семье. Живёт без отца, взял роль старшего. Депрессия отпустила.

Окружение: 5-7 друзей, все стараются развиваться. Минус — любят отдохнуть раз в 2 недели.

Состояние: 7/10. Всё бесит, хочется выйти на конфликт из-за тупости людей. Алкоголь раз в 1-2 недели (виски/вино).`,
goal:`Доход 300+ тыс к 11.04.2027. Кредиты закрыть к 07.07.2027. Подушка 500 тыс. Переехать отдельно. Не увеличивая времени работы в днях. Все свободные деньги — на оборудование для лаборатории.`,
plan:`Метрики: ежемесячно единицы моделировки + заработок, учёт расходов, контроль тренировок (мин 2, идеал 3 в нед).

Ограничения внутренние: потеря концентрации из-за фильмов во время работы → увеличение времени выполнения.

Сдвиги: 1) Перестать сбивать себе режим, жить по расписанию. 2) Перестать отдыхать и покупать импульсивно. 3) Помнить о потерянных 5 лет жизни, ставить себя на первое место.`}},

{id:'pavel-one',name:'Павел (ONE design)',age:32,city:'Самара',sph:'Антигравийная плёнка · детейлинг',ini:'П',clr:'#fbbf24',
info:`32 года, 6 лет в оклейке автомобилей. Бренд ONE design (премиум антигравийная плёнка). Детейлинг, покраска, импорт авто. Выгорел как ремесленник за последние 2 года. Пересадка волос — 1 мес без спорта.`,
zoom:{att:true,q:`2-3 года работал каждый день с утра до ночи. Вышел на хороший заработок, стал инвестировать. Надо набирать команду, но нет сил и желания. Понимаю что делать, но абсолютно не делаю. Хочу зажечься.`,zr:`Попахивает выгоранием. Будем разбирать. Часто саботируем себя, не понимая почему.`},
goals:['Выйти из выгорания и прокрастинации','Компания по продаже пленок оборот от 10 млн/мес','Своя коммерческая недвижимость','Открыть 2-ю точку оклейки'],
strategy:{
pointA:`Точка А: Выгорание. Хаос в личных делах. Самобичевание. Прокрастинация.

Физическое/моральное состояние 3/10. Эмоциональное 3/10. Энергия 4/10. Настрой поменять жизнь 100/10.

Бизнес: ЗП фонд 500-600, аренда 80-100, нюансы 100-300, расходники 50. Итого расходы бизнеса 800-1000 тыс. Чистая прибыль от 15 до 100 тыс/день (не может точно назвать).

Личные расходы: жильё 16, еда 50, школа ребёнка 50, кредит 35, авто 40-50, досуг 80-100, помощь родителям 50. Итого ~350.

Взаимодействие с сыном — нужно больше уделять времени. Финансовая безграмотность — не считает и не планирует. Личные отношения — страдает по бывшей.`,
goal:`Точка Б через год: 1) Компания по продаже антигравийных плёнок с оборотом от 10 млн/мес. 2) Своя коммерческая недвижимость. 3) Отложить 1 млн свободных. 4) Закрыть год с 28-30 млн в товарке.`,
plan:`Помесячный план: Мес 1 — спорт стоп (пересадка), дыхательные тренировки, вакуум. Книга (15-20 стр/день). Наладить питание. Собрать долги (920 тыс). Завести видеоблог. Реализовать наружную рекламу. Аскеза 30 дней.

Мес 2 — плотно спорт (утром отжимания, вечером бег+зал). Книга. Питание. Новые ресурсы привлечения клиентов (личные встречи, обзвон, акции). Новые цветные материалы. Найм/обучение персонала. Видеоблог.

Мес 3 — спорт (убрать живот). Подготовка к открытию 2-й точки оклейки. Поездка в Китай на заводы. Отложить 1 млн. Видеоблог.

Мес 4-5 — спорт (тело в порядке). Закупка оптом из Китая. Открытие офлайн точки продажи инструмента/плёнки. Активные продажи бренда по Самарской области и регионам.`}},

{id:'ilya',name:'Илья Ромаданов',age:null,city:'Самара',sph:'Найм (Docke) · бывш. импорт из Китая',ini:'И',clr:'#f87171',
info:`Компания Docke — производитель стройматериалов. Позиция: развитие бизнеса ПФО, продажа SPC напольных покрытий. В найме месяц. Последние 2.5 года развивал свой бизнес совмещая с работой. Последний год — уволился из найма и развивал бизнес. Кассовый разрыв → заморозил бизнес → вернулся в найм. Разрыв отношений 2 мес назад (второй брак, 5 лет). 1 ребёнок 11 лет от первого брака.`,
zoom:{att:true,q:`Организовал бизнес, но нет идейных людей. Партнёр загорелся — перегорел. Заморозил бизнес. Пошли страхи, сомнения. Никто не поддерживает — ни семья, ни друзья. Нет старшего, нет мужской поддержки.`,zr:`Ошибки дают обратную связь, удача ничего не даёт. Каждая ошибка — точка роста. Успех — это движение от пиздеца к пиздецу.`},
goals:['Успешно работать в должности, развить территории','Доход 500 тыс к 15.11.2027','Создать бизнес с доходом от 1 млн к 15.11.2029','Мышечная масса +7 кг к 01.03.2027','Возобновить отношения с супругой к 15.11.2026'],
strategy:{
pointA:`Дело: Найм (Docke), развитие дистрибуции SPC. Годовой доход от 2.4 млн. Работает в найме месяц. Бизнес заморожен — кассовый разрыв.

Финансы: 200-250 тыс/мес. Квартира (ипотека). Ипотека+комуналка 50, алименты 20, питание 30. Без дохода проживёт 1 месяц.

Тело: 175/71. Сон 7 ч. Физнагрузка 3 р/нед.

Отношения: Разрыв 2 мес назад (второй брак, 5 лет). 1 ребёнок 11 лет. С мамой доверительные (личная жизнь не обсуждается).

Окружение: Друзья нейтральные.

Состояние: Энергия 7, ясность 7, тонус 6. Депрессивные моменты — переживает расставание, потерю всего что строил. Обнулился. Алкоголь исключил.`,
goal:`Дело: доход 500 тыс к 15.11.2027. Бизнес с 1 млн к 15.11.2029.
Тело: +7 кг мышц к 01.03.2027. Уверенность в себе, жизненный тонус и энергия до конца 2026.
Отношения: возобновить с супругой к 15.11.2026.
Окружение: круг идейных людей, хобби вместе.`,
plan:`Ограничения: отсутствие финансов, разочарование в бизнес-партнёрах, потеря энергии на создание бизнеса с учётом прожитых моментов.

Сдвиги: 1) Обрести уверенность в себе. 2) Наладить только положительные мысли. 3) Обрести круг людей для роста.`}},

{id:'nikolay',name:'Николай Логинов',age:43,city:'Москва',sph:'IT-техдир · столовая «Оливьешка» · ВезёмОбед · AI-проекты',ini:'Н',clr:'#34d399',
info:`43 года, Москва. Женат 18 лет (вместе 20). Двое детей (дочь 17, сын 8). 25 лет в IT, 14 лет в одной компании, 12 из них техдир. Программирует >35 лет. Столовая «Оливьешка» + доставка «ВезёмОбед». AI-проект «Балбес» (семейный ассистент). NDA по основной работе.`,
zoom:{att:false,q:'',zr:''},
goals:['Бизнес: 500 тыс ЧП/мес со столовой+доставка','Проекты: 10 тыс подписчиков, 100 тыс ЧП от агента','Портфель 2 млн на фондовом рынке','Тело: 30 отжиманий, 1 подтягивание, планка 3 мин'],
strategy:{
pointA:`Найм: 14 лет в IT-компании, техдир+программист. Оклад ~120 тыс (белая) + процент прибыли. Средний ~600 тыс/мес (сезонная). NDA.

Бизнес: Столовая «Оливьешка» + «ВезёмОбед». Вышел из партнёрства апрель 2026, выкупил долю за 1 млн. Развил доставку с 0 до 1.8 млн/мес. Собрал команду, IT-систему (заказы, меню, iiko, аналитика, УПД). В среднем за год -100 тыс/мес (минус). Перспектива: +500 тыс ЧП при обороте от 4 млн (сейчас ~3 млн). Нужно +150 чел/день, 5-6 контрактов. 3 контракта на стадии подписания.

Проекты: «Балбес» AI-ассистент (напоминания, список покупок, генерация изображений, долгосрочная память). «Балбес SMM контент-завод». Доход 0, расходы 20-40 тыс/мес.

Финансы: Доход 600 тыс. Расходы обязательные 150 тыс. Портфель РФ ~1 млн, портфель США ~12 тыс $ (не вывести). Кредит 200 тыс. Без дохода 1 месяц.

Тело: 182/101 кг. Сон 8-10 ч. Физнагрузка: что-то на даче без энтузиазма. Тестостерон 3.2 (низкий).

Отношения: С женой на 3. Чуть не развелись пару лет назад — остался из-за детей. Работает с утра до ночи, в выходные гуманитарка/политика. Час вечером за ужином. Общение с психологом.

Окружение: Тимур (друг 20 лет, нейтрально), Паша (экс-партнёр, нейтрально/вверх), Андрей (сослуживец СВО, вверх), жена (нейтрально), психолог (вверх).

Состояние: 6/10 или меньше. Ясность целей 10. Тонус 5. Откаты/стресс (кассовый разрыв сейчас). Алкоголь — страсть, сейчас держит: будни без, выходные выпивает.`,
goal:`Бизнес: в ноль к концу сентября → 200 ЧП (4 кв 2026) → 400 (1 кв 2027) → 500 (2 кв) → 600 (3 кв).
Проекты: запуск агента + блог → 500 → 2000 → 5000 → 10000 подписчиков. 20→50→100→150 платных аккаунтов.
Финансы: 50% ЧП бизнеса → фондовый рынок до 2 млн.
Тело: зарядка → зал 3 р/нед. Вит D до 50-60.`,
plan:`Ограничения внешние: бизнес — нет отдела продаж, нет маркетинга, нужен шеф, нет подушки. Проекты — стартап, нет понимания как двигаться. Финансы — большое потребление семьи.

Внутренние: бизнес — мечется как белка, недостаточно жёсток с персоналом/клиентами. Проекты — страх делать «на мусорку». Тело — блокировка «я так никогда не мог». Привычки — пагубные на протяжении лет. Интроверт.

Сдвиги: 1) Жёстче отстаивать интересы и границы. 2) Больше времени себе, не быть удобным для всех. 3) Меньше думать, больше делать — решения на убеждениях, а не на сомнениях.`}},

{id:'makar',name:'Макар',age:26,city:'Самара',sph:'Найм (логистика) · опыт: танцы → спецтехника → нерудка',ini:'М',clr:'#f87171',
info:`26 лет. Профессиональный танцор → тренер → предприниматель. Танцевальная студия (вывел в прибыль, передал). Спецтехника с партнёром (схематоз, накрылось). Нерудные материалы (6 самосвалов, 15 человек, выручка 70 млн, ЧП 13 млн, доля 50%). Просрали компанию с партнёром. Вернулся в Самару, первый найм — логист-диспетчер. Девушка 3 года, сделал предложение, свадьба в след. году.`,
zoom:{att:true,q:`От неудачи к неудаче — один, второй, третий бизнес. Близок к выгоранию. Замылился взгляд — не видишь куда двигаться, какое предназначение. Нет картинки что хочу.`,zr:''},
goals:['Открыть танцевальную студию, выручка 1.2 млн','Упаковать модель в франшизу, продать 1','Доход 500 тыс','Долги сократить наполовину','Вес 84 кг','Жениться к 31.08.2027','25 новых знакомств с предпринимателями'],
strategy:{
pointA:`Дело: Крайнее — учредитель компании нерудных материалов (6 самосвалов, 15 чел, выручка 70 млн, ЧП 13 млн, доля 50%). Закрытие декабрь 2025. Задолженность ~10.5 млн. С февраля 2026 — найм, логист-диспетчер в нефтетранспортной. ЗП неофициальная 60-72 тыс + допдоход (бухгалтерия, танцы, фондовый рынок). Совокупный ~150 тыс.

Финансы: Доход 150 тыс. Расходы 110 тыс. Инвест. займ 1 млн (актив). Личные займы 850 тыс (пассив). Подушки нет.

Тело: 190/76, жир не знает. Сон 8 ч. Кардио 3 р/нед, силовые 1-2 дома без чёткого графика.

Отношения: Не женат, девушка 3 года, сделал предложение. Отношения стабильные, лёгкое напряжение из-за финансов. С родителями доверительные (оба пенсионеры), установка «всё сам». Партнёр/друг — конфликт на финансовой почве, в процессе закрытия бизнеса.

Окружение: Из-за переезда окружения нет. Общение: девушка + коллеги (тянут вниз, разный уровень). Лёгкое выгорание, книги тушат пожар.

Состояние: Энергия 5, ясность целей 3, тонус 6. Нет ясности куда двигаться → просадка в энергии.`,
goal:`Дело: танцевальная студия → выручка 300→800-1000→1.3-1.5 млн → франшиза.
Финансы: доход 500 тыс, долги -50%.
Тело: зал + чекап + анализы → вес 84 кг.
Отношения: загс → свадьба к 31.08.2027.
Окружение: 25 новых знакомств.`,
plan:`Декомпозиция: 1 кв — найти помещение, найм, стратегия запуска. 2 кв — старт, клиентские группы, выручка 300 тыс, выход в ноль. 3 кв — выручка 800-1000, масштабирование. 4 кв — выручка 1.3-1.5, продажа франшизы.

Ограничения внешние: долги, график найма. Внутренние: реактивность на чужое мнение, страх делать в одиночку.

Сдвиги: (не дописаны в документе)`}},

{id:'sergey-n',name:'Сергей Насеткин',age:39,city:'Москва',sph:'Морепродукты · стройка · клининг',ini:'СН',clr:'#a78bfa',
info:`39 лет, Москва. По образованию политолог. Морепродукты (чёрная икра), стройка (44ФЗ косметические ремонты), клининг (44ФЗ). Везде партнёрство. Увлекается психотерапией и шаманизмом. Активный спорт прервался. Разжирел с 90 до 110. Ушёл от жены в этом месяце. Сын 7 лет.`,
zoom:{att:true,q:`Понравился посыл — сильное окружение. Был в аномалии Гребенюка — много народа, нет качества. 20 человек — идеальная история. Ушёл с зума на переговоры.`,zr:''},
goals:['Клининг — вектор от Жданова','Морепродукты суммарно 5+ ЧП','Стройка + клининг стабильно +3 ЧП/мес','Вернуть 90-95 кг полезной массы','Взрослые отношения с бывшей женой','Больше времени с сыном и родителями'],
strategy:{
pointA:`Дело: морепродукты (пересобрали с декабря, синусоидный доход, за май 450, июнь-август <50/мес), стройка (прошлый год вал 2.5 млн), клининг (работает месяц). Во всех сферах — документооборот, RND. Системы нет — пересборка партнёрств.

Финансы: Активы — квартира (живёт бывшая с сыном), часть прибыли в оборотке. Пассивы: проживание+помощь семье 100-150/мес, заёмные в оборотке. Без дохода — «полезу на пальму».

Тело: 193/110. Сон 6-7 ч. Физнагрузка: пропуск неделя, остальное 4 р/нед.

Отношения: Ушёл от жены в этом месяце. 1 сын 7 лет. С родителями спокойные. С основным партнёром тёплые отношения.

Окружение: Разноплановое. Нытиков нет, все незаурядные. Тянущих вниз нет.

Состояние: Энергия 5-8 (зависит от сна/спорта). Ясность 7-8, тонус 4-8. Алкоголь — в аскезе позволил пару раз, удовольствия не получил.`,
goal:`Дело: понятный график, вечер для себя/семьи с 7-8. Морепродукты+стройка: закрыть невыгодные инвестиции, привлечь адекватных инвесторов. Морепродукты до 5+ ЧП, стройка+клининг +3 ЧП/мес.
Тело: 90-95 кг полезной массы, убрать жир.
Отношения: дипломатия с бывшей, контакт с сыном, время с родителями.`,
plan:`Ограничения: неумелый тайм-менеджмент, нужно привлекать финансы, упадок мотивации из-за «летнего кладбища в торговле».

Первичные цели: вернуть тонус в тело, укрепить почву, путешествия.

Рекомендация Жданова (из разбора): сосредоточиться на клининге, фокус, не расфокусироваться. Тревожный ум мешает мыслить свободно. Клининг для гостиниц — кейс. Персонал: привозить из бедных регионов (Калмыкия, деревни), снимать квартиру. Сарафан пойдёт без рекламы, если цена-качество.`}},

// ===== STORAGE (localStorage fallback for now) =====
const SK='dvadtsatka_v3';
function ld(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{}}catch(e){return{}}}
function sv(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch(e){alert('Ошибка: '+e.message)}}
function gd(id){const a=ld();return a[id]||{razbory:[],timeline:[],notes:''}}
function sd(id,d){const a=ld();a[id]=d;sv(a)}

let cid=P[0].id,ctab='profile';

function rSb(){
document.getElementById('sl').innerHTML=P.map(p=>{
const d=gd(p.id),rc=d.razbory?.length||0;
return`<div class="pi ${p.id===cid?'act':''}" onclick="sel('${p.id}')">
<div class="av" style="background:${p.clr}">${p.ini}</div>
<div class="pi-info"><div class="pi-name">${p.name}</div>
<div class="pi-meta">${p.city}${rc?` · ${rc} разб.`:''}</div></div></div>`}).join('')}

function sel(id){cid=id;ctab='profile';rSb();rCt()}
function st(t){ctab=t;rCt()}

function rCt(){
const p=P.find(x=>x.id===cid);if(!p)return;
const d=gd(p.id),st2={rz:d.razbory?.length||0,tk:(d.timeline||[]).filter(t=>t.type==='task').length,wn:(d.timeline||[]).filter(t=>t.type==='win').length,ml:(d.timeline||[]).filter(t=>t.type==='milestone').length};

document.getElementById('ct').innerHTML=`
<div class="ph"><div class="av-l" style="background:${p.clr}">${p.ini}</div>
<div class="pt"><h2>${p.name}</h2><div class="meta">${[p.age?p.age+' лет':null,p.city].filter(Boolean).join(' · ')}</div>
<div class="sph">${p.sph}</div></div></div>

<div class="stats">
<div class="stat"><div class="stat-l">Разборов</div><div class="stat-v">${st2.rz}</div></div>
<div class="stat"><div class="stat-l">Заданий</div><div class="stat-v">${st2.tk}</div></div>
<div class="stat"><div class="stat-l">Побед</div><div class="stat-v">${st2.wn}</div></div>
<div class="stat"><div class="stat-l">Вех</div><div class="stat-v">${st2.ml}</div></div></div>

<div class="tabs">
<button class="tab ${ctab==='profile'?'act':''}" onclick="st('profile')">Профиль</button>
<button class="tab ${ctab==='strategy'?'act':''}" onclick="st('strategy')">Стратегия</button>
<button class="tab ${ctab==='razbory'?'act':''}" onclick="st('razbory')">Разборы</button>
<button class="tab ${ctab==='path'?'act':''}" onclick="st('path')">Путь</button>
<button class="tab ${ctab==='notes'?'act':''}" onclick="st('notes')">Заметки</button></div>

<div class="tc ${ctab==='profile'?'act':''}">${rPr(p)}</div>
<div class="tc ${ctab==='strategy'?'act':''}">${rSt(p)}</div>
<div class="tc ${ctab==='razbory'?'act':''}">${rRz(p,d)}</div>
<div class="tc ${ctab==='path'?'act':''}">${rPa(p,d)}</div>
<div class="tc ${ctab==='notes'?'act':''}">${rNo(p,d)}</div>`}

function rPr(p){
const z=p.zoom||{};
return`<div class="cd"><h3>Первичная информация о себе</h3><p>${esc(p.info)}</p></div>
<div class="cd"><h3>На установочном зуме ${z.att?'':'<span class="nb">не высказывался</span>'}</h3>
${z.att?`<div class="q">${esc(z.q)}</div>${z.zr?`<div class="zr"><div class="lbl">Реакция Жданова</div><div style="white-space:pre-wrap">${esc(z.zr)}</div></div>`:''}`:`<p style="color:var(--txm);font-style:italic">Не высказывался.</p>`}</div>
${p.goals?.length?`<div class="cd"><h3>Цели / запрос</h3><ul class="gl">${p.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>`:''}`}

function rSt(p){
const s=p.strategy||{};
return`<div class="cd"><h3>Точка А · аудит текущей позиции</h3><p>${esc(s.pointA)}</p></div>
${s.goal?`<div class="cd"><h3>Цели года · точка Б</h3><p>${esc(s.goal)}</p></div>`:''}
${s.plan?`<div class="cd"><h3>Декомпозиция · ограничения · сдвиги</h3><p>${esc(s.plan)}</p></div>`:''}`}

function rRz(p,d){
const rz=(d.razbory||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
const nn=rz.length+1;
return`<div class="ae"><h4>Добавить разбор №${nn}</h4>
<div class="hn">Фиксируем после каждой встречи: что разбирали, обратная связь Жданова, вектор движения.</div>
<div class="fb"><label class="fl">Дата</label><input type="date" id="rz-d" value="${new Date().toISOString().split('T')[0]}" style="max-width:200px"></div>
<div class="fb"><label class="fl">Тема</label><input id="rz-t" placeholder="Кратко — про что разбор"></div>
<div class="fb"><label class="fl">Обратная связь Жданова</label><textarea id="rz-c" placeholder="Что Жданов сказал: диагноз, где ошибка, конкретика..."></textarea></div>
<div class="fb"><label class="fl">Вектор движения → до следующего разбора</label><textarea id="rz-v" placeholder="Конкретные действия, задания, дедлайны..."></textarea></div>
<button class="btn" onclick="addRz()">Сохранить разбор №${nn}</button></div>
${!rz.length?`<div class="empty"><h3>Разборов пока нет</h3><p>Добавляй после каждой встречи с Ждановым.</p></div>`:rz.map((r,i)=>`
<div class="rz"><div class="rz-h"><div><div class="rz-n">Разбор №${i+1}${r.topic?' · '+esc(r.topic):''}</div><div class="rz-d">${fmtD(r.date)}</div></div>
<button class="btn-d" onclick="delRz(${i})">Удалить</button></div>
${r.content?`<div class="rz-s"><div class="rz-sl">Обратная связь Жданова</div><div class="rz-sb">${esc(r.content)}</div></div>`:''}
${r.vector?`<div class="rz-s rz-v"><div class="rz-sl">Вектор движения → до следующего разбора</div><div class="rz-sb">${esc(r.vector)}</div></div>`:''}</div>`).join('')}`}

function rPa(p,d){
const tl=(d.timeline||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
const tl2={milestone:'Веха',task:'Задание',win:'Победа',setback:'Откат',note:'Наблюдение'};
return`<div class="ae"><h4>Добавить точку</h4>
<div class="fr"><input type="date" id="pa-d" value="${new Date().toISOString().split('T')[0]}" style="flex:0 0 170px">
<select id="pa-t" style="flex:0 0 180px"><option value="milestone">Веха</option><option value="task">Задание</option><option value="win">Победа</option><option value="setback">Откат</option><option value="note">Наблюдение</option></select>
<input id="pa-n" placeholder="Название"></div>
<textarea id="pa-b" placeholder="Что произошло..."></textarea>
<div style="margin-top:10px"><button class="btn" onclick="addPa()">Добавить</button></div></div>
${!tl.length?`<div class="empty"><h3>Путь не начат</h3></div>`:`<div class="tl">${tl.map((t,i)=>{
const ri=(d.timeline||[]).findIndex(x=>x.date===t.date&&x.title===t.title);
return`<div class="ti t-${t.type}"><div class="tl-d">${fmtD(t.date)} · ${tl2[t.type]||''}</div>
<div class="tl-t">${esc(t.title)} <button class="btn-d" style="float:right;font-size:10px;padding:2px 6px" onclick="delPa(${ri})">×</button></div>
${t.body?`<div class="tl-b">${esc(t.body)}</div>`:''}</div>`}).join('')}</div>`}`}

function rNo(p,d){
return`<div class="ae"><h4>Заметки</h4>
<div class="hn">Наблюдения, гипотезы, детали — то, что не влезает в структуру.</div>
<textarea id="no-t" style="min-height:300px" placeholder="Всё, что нужно помнить...">${esc(d.notes||'')}</textarea>
<div style="margin-top:10px;display:flex;gap:8px;align-items:center">
<button class="btn" onclick="svNo()">Сохранить</button><span id="no-sv" class="sv">✓</span></div></div>`}

function addRz(){
const dt=document.getElementById('rz-d').value,tp=document.getElementById('rz-t').value.trim(),
ct=document.getElementById('rz-c').value.trim(),vc=document.getElementById('rz-v').value.trim();
if(!ct&&!vc){alert('Заполни хотя бы обратную связь или вектор');return}
const d=gd(cid);d.razbory=d.razbory||[];d.razbory.push({date:dt,topic:tp,content:ct,vector:vc});sd(cid,d);rSb();rCt()}

function delRz(i){if(!confirm('Удалить?'))return;const d=gd(cid);
const rz=d.razbory.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
const t=rz[i],ri=d.razbory.findIndex(x=>x.date===t.date&&x.topic===t.topic);
if(ri>=0)d.razbory.splice(ri,1);sd(cid,d);rSb();rCt()}

function svNo(){const d=gd(cid);d.notes=document.getElementById('no-t').value;sd(cid,d);
const s=document.getElementById('no-sv');s.style.opacity='1';setTimeout(()=>{s.style.opacity='0'},2000)}

function addPa(){
const dt=document.getElementById('pa-d').value,tp=document.getElementById('pa-t').value,
nm=document.getElementById('pa-n').value.trim(),bd=document.getElementById('pa-b').value.trim();
if(!nm){alert('Укажи название');return}
const d=gd(cid);d.timeline=d.timeline||[];d.timeline.push({date:dt,type:tp,title:nm,body:bd});sd(cid,d);rSb();rCt()}

function delPa(i){if(!confirm('Удалить?'))return;const d=gd(cid);d.timeline.splice(i,1);sd(cid,d);rSb();rCt()}

function exportAll(){
const d=ld();const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;
a.download=`dvadtsatka-${new Date().toISOString().split('T')[0]}.json`;a.click();URL.revokeObjectURL(u)}

function importAll(e){
const f=e.target.files[0];if(!f)return;const r=new FileReader();
r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!confirm('Перезаписать все записи?'))return;
sv(d);rSb();rCt();alert('Импортировано')}catch(er){alert('Ошибка: '+er.message)}};r.readAsText(f);e.target.value=''}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function fmtD(s){if(!s)return'';const d=new Date(s),m=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];return`${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`}

rSb();rCt();
</script>
</body>
</html>
